# ============================================================================
# Tool-Klipper-Calibration: Automated Safe Staging & Position Teaching
# ============================================================================
# Note: The 1-click commands:
#   AUTO_TEACH_CAMERA, AUTO_TEACH_SWITCH, CENTER_NOZZLE, TEST_NOZZLE_VISION
# are registered natively in Python by [tool_calibrator].
# They are not duplicated here to prevent "already registered" errors in Klipper.
# ============================================================================

# ----------------------------------------------------------------------------
# Manual Waypoint Teaching Overrides (Optional convenience macros)
# ----------------------------------------------------------------------------

[gcode_macro TEACH_CAMERA_SAFE_Z]
description: Record current Z height as the global safe transit Z height
gcode:
    CALIBRATION_SET_SAFE_POS STATION=CAMERA TYPE=SAFE_Z SAVE=1
    {action_respond_info("Camera Safe Z height updated and saved.")}

[gcode_macro TEACH_CAMERA_APPROACH]
description: Record current toolhead position as Camera Safe Approach waypoint
gcode:
    CALIBRATION_SET_SAFE_POS STATION=CAMERA TYPE=APPROACH SAVE=1
    {action_respond_info("Camera Approach waypoint updated and saved.")}

[gcode_macro TEACH_CAMERA_TARGET]
description: Record current toolhead position as Camera Inspection Target position
gcode:
    CALIBRATION_SET_SAFE_POS STATION=CAMERA TYPE=TARGET SAVE=1
    {action_respond_info("Camera Target position updated and saved.")}

[gcode_macro TEACH_SWITCH_APPROACH]
description: Record current toolhead position as Z Switch Safe Approach waypoint
gcode:
    CALIBRATION_SET_SAFE_POS STATION=SWITCH TYPE=APPROACH SAVE=1
    {action_respond_info("Z Switch Approach waypoint updated and saved.")}

[gcode_macro TEACH_SWITCH_TARGET]
description: Record current toolhead position as Z Switch Probing Target position
gcode:
    CALIBRATION_SET_SAFE_POS STATION=SWITCH TYPE=TARGET SAVE=1
    {action_respond_info("Z Switch Target position updated and saved.")}

[gcode_macro GOTO_CAMERA_TARGET]
description: Safely navigate toolhead to Camera Inspection Station using 3-tier safe path
gcode:
    CALIBRATION_NAVIGATE STATION=CAMERA

[gcode_macro GOTO_SWITCH_TARGET]
description: Safely navigate toolhead to Z Switch Station using 3-tier safe path
gcode:
    CALIBRATION_NAVIGATE STATION=SWITCH

[gcode_macro LEAVE_CALIBRATION_STATION]
description: Safely depart calibration station to safe transit altitude
gcode:
    CALIBRATION_NAVIGATE STATION=DEPART


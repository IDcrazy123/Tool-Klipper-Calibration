# ============================================================================
# Tool-Klipper-Calibration: Interactive Safe Staging Position Teaching
# ============================================================================
# These macros allow interactive teaching of the 3-tier safe waypoints.
# Jog the toolhead to the target location in Mainsail/Fluidd and run the
# corresponding macro to record that location into active memory.
# ============================================================================

[gcode_macro TEACH_CAMERA_SAFE_Z]
description: Record current Z height as the global safe transit Z height
gcode:
    CALIBRATION_SET_SAFE_POS STATION=CAMERA TYPE=SAFE_Z
    {action_respond_info("Camera Safe Z height updated from current toolhead position.")}

[gcode_macro TEACH_CAMERA_APPROACH]
description: Record current toolhead position as Camera Safe Approach waypoint
gcode:
    CALIBRATION_SET_SAFE_POS STATION=CAMERA TYPE=APPROACH
    {action_respond_info("Camera Approach waypoint updated from current toolhead position.")}

[gcode_macro TEACH_CAMERA_TARGET]
description: Record current toolhead position as Camera Inspection Target position
gcode:
    CALIBRATION_SET_SAFE_POS STATION=CAMERA TYPE=TARGET
    {action_respond_info("Camera Target position updated from current toolhead position.")}

[gcode_macro TEACH_SWITCH_APPROACH]
description: Record current toolhead position as Z Switch Safe Approach waypoint
gcode:
    CALIBRATION_SET_SAFE_POS STATION=Z_SWITCH TYPE=APPROACH
    {action_respond_info("Z Switch Approach waypoint updated from current toolhead position.")}

[gcode_macro TEACH_SWITCH_TARGET]
description: Record current toolhead position as Z Switch Probing Target position
gcode:
    CALIBRATION_SET_SAFE_POS STATION=Z_SWITCH TYPE=TARGET
    {action_respond_info("Z Switch Target position updated from current toolhead position.")}

[gcode_macro GOTO_CAMERA_TARGET]
description: Safely navigate toolhead to Camera Target position using 3-tier safe path
gcode:
    {action_respond_info("Navigating safely to Camera Station...")}
    CALIBRATION_STATUS

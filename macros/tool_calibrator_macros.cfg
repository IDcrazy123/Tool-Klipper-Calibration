# ============================================================================
# Tool-Klipper-Calibration: User Macros & Automation Hooks
# ============================================================================
# These macros provide user-friendly commands and lifecycle hooks for
# automated machine vision XY calibration and multi-backend Z calibration.
# Include this file in your printer.cfg:
#   [include macros/tool_calibrator_macros.cfg]
# ============================================================================

[gcode_macro CALIBRATE_ALL_TOOLS]
description: Run automated XY and Z calibration on all configured tools
gcode:
    {% set calibrate_xy = params.CALIBRATE_XY|default(1)|int %}
    {% set calibrate_z = params.CALIBRATE_Z|default(1)|int %}
    {% set save_config = params.SAVE_CONFIG|default(1)|int %}
    {% set dry_run = params.DRY_RUN|default(0)|int %}
    {% set clean_nozzle = params.CLEAN_NOZZLE|default(0)|int %}
    {% set order = params.ORDER|default("XY_FIRST")|string %}
    {% set compensate_focal_z = params.COMPENSATE_FOCAL_Z|default(0)|int %}
    {% set samples = params.SAMPLES|default(3)|int %}
    {% set wiggle = params.WIGGLE|default(1)|int %}
    {% set tools = params.TOOLS|default("")|string %}

    {action_respond_info("=== Starting Automated Multi-Tool Calibration ===")}
    _CALIBRATION_PRE_FLIGHT

    {% if tools != "" %}
        CALIBRATE_TOOL_OFFSETS TOOLS={tools} CALIBRATE_XY={calibrate_xy} CALIBRATE_Z={calibrate_z} SAVE_CONFIG={save_config} DRY_RUN={dry_run} CLEAN_NOZZLE={clean_nozzle} ORDER={order} COMPENSATE_FOCAL_Z={compensate_focal_z} SAMPLES={samples} WIGGLE={wiggle}
    {% else %}
        CALIBRATE_TOOL_OFFSETS CALIBRATE_XY={calibrate_xy} CALIBRATE_Z={calibrate_z} SAVE_CONFIG={save_config} DRY_RUN={dry_run} CLEAN_NOZZLE={clean_nozzle} ORDER={order} COMPENSATE_FOCAL_Z={compensate_focal_z} SAMPLES={samples} WIGGLE={wiggle}
    {% endif %}

    _CALIBRATION_POST_FLIGHT
    {action_respond_info("=== Multi-Tool Calibration Sequence Completed ===")}

[gcode_macro CALIBRATE_TOOL]
description: Calibrate specific tool(s) by index (e.g. CALIBRATE_TOOL TOOL=1)
gcode:
    {% set tool = params.TOOL|default(-1)|int %}
    {% set calibrate_xy = params.CALIBRATE_XY|default(1)|int %}
    {% set calibrate_z = params.CALIBRATE_Z|default(1)|int %}
    {% set save_config = params.SAVE_CONFIG|default(1)|int %}
    {% set dry_run = params.DRY_RUN|default(0)|int %}
    {% set clean_nozzle = params.CLEAN_NOZZLE|default(0)|int %}
    {% set order = params.ORDER|default("XY_FIRST")|string %}
    {% set compensate_focal_z = params.COMPENSATE_FOCAL_Z|default(0)|int %}
    {% set samples = params.SAMPLES|default(3)|int %}
    {% set wiggle = params.WIGGLE|default(1)|int %}

    {% if tool < 0 %}
        {action_raise_error("CALIBRATE_TOOL requires a valid TOOL parameter, e.g. CALIBRATE_TOOL TOOL=1")}
    {% endif %}

    {action_respond_info("Calibrating Tool T%d..." % (tool))}
    _CALIBRATION_PRE_FLIGHT

    CALIBRATE_TOOL_OFFSETS TOOLS={tool} CALIBRATE_XY={calibrate_xy} CALIBRATE_Z={calibrate_z} SAVE_CONFIG={save_config} DRY_RUN={dry_run} CLEAN_NOZZLE={clean_nozzle} ORDER={order} COMPENSATE_FOCAL_Z={compensate_focal_z} SAMPLES={samples} WIGGLE={wiggle}

    _CALIBRATION_POST_FLIGHT

[gcode_macro CALIBRATE_CAMERA]
description: Star-pattern camera scale (mm/pixel) and affine matrix calibration
gcode:
    {% set dist = params.DISTANCE|default(1.0)|float %}
    {action_respond_info("=== Calibrating Camera Scale & Transformation Matrix ===")}
    _CALIBRATION_PRE_FLIGHT
    CALIBRATE_CAMERA_SCALE DISTANCE={dist}
    _CALIBRATION_POST_FLIGHT

[gcode_macro CALIBRATION_ROLLBACK]
description: Quick rollback to previous calibration backup file
gcode:
    {% set backup = params.BACKUP|default("")|string %}
    {% if backup != "" %}
        CALIBRATION_ROLLBACK_OFFSETS BACKUP={backup}
    {% else %}
        CALIBRATION_ROLLBACK_OFFSETS
    {% endif %}

# ----------------------------------------------------------------------------
# Lifecycle Hooks (Override these in your personal printer configuration)
# ----------------------------------------------------------------------------

[gcode_macro _CALIBRATION_PRE_FLIGHT]
description: Hook executed before calibration sequence begins
gcode:
    {action_respond_info("Running pre-flight checks...")}
    # Ensure printer is homed
    {% if "xyz" not in printer.toolhead.homed_axes %}
        {action_respond_info("Homing all axes prior to calibration...")}
        G28
    {% endif %}

    # Optional: Turn on camera backlight or chamber lights here
    # SET_PIN PIN=camera_light VALUE=1.0

    # Optional: Ensure nozzle is at non-oozing inspection temperature if needed
    # M104 S150

[gcode_macro _CALIBRATION_POST_FLIGHT]
description: Hook executed after calibration sequence completes
gcode:
    {action_respond_info("Running post-flight cleanup...")}
    # Turn off inspection temperature if set
    # M104 S0

    # Optional: Turn off camera backlight
    # SET_PIN PIN=camera_light VALUE=0.0

    # Move to safe Z height
    G90
    G1 Z35 F3000

[gcode_macro _CLEAN_NOZZLE]
description: Optional hook to wipe nozzle on brush before optical calibration
gcode:
    # No-op by default for generic toolchangers without a physical brush.
    # If your machine has a physical nozzle brush or purge bucket, override in printer.cfg:
    #   CLEAN_NOZZLE_BRUSH TOOL={params.TOOL|default(0)}

# ----------------------------------------------------------------------------
# Optical Lighting Hooks (Camera Ring LED & Toolhead Nozzle LED Control)
# ----------------------------------------------------------------------------

[gcode_macro _CALIBRATION_CAMERA_LED_ON]
description: Turns on camera ring light for optical inspection
gcode:
    # Example for PWM pin:
    # SET_PIN PIN=cam_light VALUE=0.4
    # Example for Neopixel / WS2812B:
    # SET_LED LED=cam_ring RED=0.8 GREEN=0.8 BLUE=0.8 WHITE=0.8

[gcode_macro _CALIBRATION_CAMERA_LED_OFF]
description: Turns off camera ring light after inspection
gcode:
    # Example for PWM pin:
    # SET_PIN PIN=cam_light VALUE=0.0
    # Example for Neopixel / WS2812B:
    # SET_LED LED=cam_ring RED=0 GREEN=0 BLUE=0 WHITE=0

[gcode_macro _CALIBRATION_NOZZLE_LED_OFF]
description: Turns off toolhead nozzle LED to prevent camera sensor blooming/glare
gcode:
    # Example for StealthBurner sb_leds:
    # SET_LED LED=sb_leds INDEX=2 RED=0 GREEN=0 BLUE=0 WHITE=0
    # SET_LED LED=sb_leds INDEX=3 RED=0 GREEN=0 BLUE=0 WHITE=0
    # Or macro hook:
    # STATUS_OFF

[gcode_macro _CALIBRATION_NOZZLE_LED_ON]
description: Restores toolhead nozzle LED after optical inspection
gcode:
    # Example for StealthBurner sb_leds:
    # STATUS_READY


# ============================================================================
# Tool-Klipper-Calibration: User Macros & Automation Hooks
# ============================================================================
# These macros provide user-friendly commands and lifecycle hooks for
# automated machine vision XY calibration and multi-backend Z calibration.
# Include this file in your printer.cfg:
#   [include macros/tool_calibrator_macros.cfg]
# ============================================================================

[gcode_macro CALIBRATE_ALL_TOOLS]
description: Run automated XY and Z calibration on all configured tools
gcode:
    {% set calibrate_xy = params.CALIBRATE_XY|default(1)|int %}
    {% set calibrate_z = params.CALIBRATE_Z|default(1)|int %}
    {% set save_config = params.SAVE_CONFIG|default(1)|int %}
    {% set dry_run = params.DRY_RUN|default(0)|int %}

    {action_respond_info("=== Starting Automated Multi-Tool Calibration ===")}
    _CALIBRATION_PRE_FLIGHT

    CALIBRATE_TOOL_OFFSETS CALIBRATE_XY={calibrate_xy} CALIBRATE_Z={calibrate_z} SAVE_CONFIG={save_config} DRY_RUN={dry_run}

    _CALIBRATION_POST_FLIGHT
    {action_respond_info("=== Multi-Tool Calibration Sequence Completed ===")}

[gcode_macro CALIBRATE_TOOL]
description: Calibrate specific tool(s) by index (e.g. CALIBRATE_TOOL TOOL=1)
gcode:
    {% set tool = params.TOOL|default(-1)|int %}
    {% set calibrate_xy = params.CALIBRATE_XY|default(1)|int %}
    {% set calibrate_z = params.CALIBRATE_Z|default(1)|int %}
    {% set save_config = params.SAVE_CONFIG|default(1)|int %}
    {% set dry_run = params.DRY_RUN|default(0)|int %}

    {% if tool < 0 %}
        {action_raise_error("CALIBRATE_TOOL requires a valid TOOL parameter, e.g. CALIBRATE_TOOL TOOL=1")}
    {% endif %}

    {action_respond_info("Calibrating Tool T%d..." % (tool))}
    _CALIBRATION_PRE_FLIGHT

    CALIBRATE_TOOL_OFFSETS TOOLS={tool} CALIBRATE_XY={calibrate_xy} CALIBRATE_Z={calibrate_z} SAVE_CONFIG={save_config} DRY_RUN={dry_run}

    _CALIBRATION_POST_FLIGHT

[gcode_macro CALIBRATE_CAMERA_SCALE]
description: Star-pattern camera scale (mm/pixel) and affine matrix calibration
gcode:
    {% set dist = params.DISTANCE|default(1.0)|float %}
    {action_respond_info("=== Calibrating Camera Scale & Transformation Matrix ===")}
    _CALIBRATION_PRE_FLIGHT
    CALIBRATE_CAMERA_SCALE DISTANCE={dist}
    _CALIBRATION_POST_FLIGHT

[gcode_macro CALIBRATION_ROLLBACK]
description: Quick rollback to previous calibration backup file
gcode:
    {% set backup = params.BACKUP|default("")|string %}
    {% if backup != "" %}
        CALIBRATION_ROLLBACK_OFFSETS BACKUP={backup}
    {% else %}
        CALIBRATION_ROLLBACK_OFFSETS
    {% endif %}

# ----------------------------------------------------------------------------
# Lifecycle Hooks (Override these in your personal printer configuration)
# ----------------------------------------------------------------------------

[gcode_macro _CALIBRATION_PRE_FLIGHT]
description: Hook executed before calibration sequence begins
gcode:
    {action_respond_info("Running pre-flight checks...")}
    # Ensure printer is homed
    {% if "xyz" not in printer.toolhead.homed_axes %}
        {action_respond_info("Homing all axes prior to calibration...")}
        G28
    {% endif %}

    # Optional: Turn on camera backlight or chamber lights here
    # SET_PIN PIN=camera_light VALUE=1.0

    # Optional: Ensure nozzle is at non-oozing inspection temperature if needed
    # M104 S150

[gcode_macro _CALIBRATION_POST_FLIGHT]
description: Hook executed after calibration sequence completes
gcode:
    {action_respond_info("Running post-flight cleanup...")}
    # Turn off inspection temperature if set
    # M104 S0

    # Optional: Turn off camera backlight
    # SET_PIN PIN=camera_light VALUE=0.0

    # Move to safe Z height
    G90
    G1 Z35 F3000

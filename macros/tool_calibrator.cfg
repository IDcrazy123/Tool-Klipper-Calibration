    {% if tool < 0 %}
        {% if printer.toolchanger is defined and printer.toolchanger.tool_number >= 0 %}
            {% set tool = printer.toolchanger.tool_number %}
        {% elif printer.tool_probe is defined and printer.tool_probe.active_tool_number is defined and printer.tool_probe.active_tool_number >= 0 %}
            {% set tool = printer.tool_probe.active_tool_number %}
        {% else %}
            {action_raise_error("CALIBRATE_TOOL_Z requires a valid TOOL parameter, e.g. CALIBRATE_TOOL_Z TOOL=1 (or run CALIBRATE_TOOLS_Z for all tools)")}
        {% endif %}
    {% endif %}

    _CALIBRATION_PRE_FLIGHT

    CALIBRATE_TOOL_OFFSETS TOOLS={tool} CALIBRATE_XY=0 CALIBRATE_Z=1 SAVE_CONFIG={save_config} DRY_RUN={dry_run} CLEAN_NOZZLE={clean_nozzle} ALLOW_SHUTTLE_Z={allow_shuttle_z} CONTINUE_ON_ERROR={continue_on_error}

    _CALIBRATION_POST_FLIGHT

[gcode_macro CALIBRATE_CAMERA]
description: Star-pattern camera scale (mm/pixel) and affine matrix calibration
gcode:
    {% set dist = params.DISTANCE|default(1.0)|float %}
    _CALIBRATION_PRE_FLIGHT
    CALIBRATE_CAMERA_SCALE DISTANCE={dist}
    _CALIBRATION_POST_FLIGHT

[gcode_macro CALIBRATION_ROLLBACK]
description: Quick rollback to previous calibration backup file
gcode:
    {% set backup = params.BACKUP|default("")|string %}
    {% if backup != "" %}
        CALIBRATION_ROLLBACK_OFFSETS BACKUP={backup}
    {% else %}
        CALIBRATION_ROLLBACK_OFFSETS
    {% endif %}


# ============================================================================
# DẠY TOẠ ĐỘ TRẠM & DI CHUYỂN AN TOÀN (SAFE STAGING & NAVIGATION)
# ============================================================================

[gcode_macro TEACH_CAMERA_SAFE_Z]
description: Record current Z height or explicit Z parameter as the global safe transit Z height
gcode:
    {% set z_val = params.Z|default("")|string %}
    {% if z_val != "" %}
        CALIBRATION_SET_SAFE_POS STATION=CAMERA TYPE=SAFE_Z Z={z_val} SAVE=1
        {action_respond_info("Camera Safe Z height set to Z=%s and saved." % (z_val))}
    {% else %}
        CALIBRATION_SET_SAFE_POS STATION=CAMERA TYPE=SAFE_Z SAVE=1
        {action_respond_info("Camera Safe Z height recorded from current position and saved.")}
    {% endif %}

[gcode_macro TEACH_CAMERA_APPROACH]
description: Record current toolhead position as Camera Safe Approach waypoint
gcode:
    CALIBRATION_SET_SAFE_POS STATION=CAMERA TYPE=APPROACH SAVE=1
    {action_respond_info("Camera Approach waypoint updated and saved.")}

[gcode_macro TEACH_CAMERA_TARGET]
description: Record current toolhead position as Camera Inspection Target position
gcode:
    CALIBRATION_SET_SAFE_POS STATION=CAMERA TYPE=TARGET SAVE=1
    {action_respond_info("Camera Target position updated and saved.")}

[gcode_macro TEACH_SWITCH_APPROACH]
description: Record current toolhead position as Z Switch Safe Approach waypoint
gcode:
    CALIBRATION_SET_SAFE_POS STATION=SWITCH TYPE=APPROACH SAVE=1
    {action_respond_info("Z Switch Approach waypoint updated and saved.")}

[gcode_macro TEACH_SWITCH_TARGET]
description: Record current toolhead position as Z Switch Probing Target position
gcode:
    CALIBRATION_SET_SAFE_POS STATION=SWITCH TYPE=TARGET SAVE=1
    {action_respond_info("Z Switch Target position updated and saved.")}

[gcode_macro GOTO_CAMERA_TARGET]
description: Safely navigate toolhead to Camera Inspection Station using 3-tier safe path
gcode:
    CALIBRATION_NAVIGATE STATION=CAMERA

[gcode_macro GOTO_SWITCH_TARGET]
description: Safely navigate toolhead to Z Switch Station using 3-tier safe path
gcode:
    CALIBRATION_NAVIGATE STATION=SWITCH

[gcode_macro LEAVE_CALIBRATION_STATION]
description: Safely depart calibration station to safe transit altitude
gcode:
    CALIBRATION_NAVIGATE STATION=DEPART


# ============================================================================
# LIFECYCLE HOOKS (Tuỳ chỉnh theo máy của bạn nếu cần)
# ============================================================================

[gcode_macro _CALIBRATION_PRE_FLIGHT]
description: Hook executed before calibration sequence begins
gcode:
    # Tự động Home nếu chưa Home
    {% if "xyz" not in printer.toolhead.homed_axes %}
        {action_respond_info("Homing all axes prior to calibration...")}
        G28
    {% endif %}

    # Tuỳ chọn: Bật đèn chiếu sáng camera hoặc chamber
    # SET_PIN PIN=camera_light VALUE=1.0

[gcode_macro _CALIBRATION_POST_FLIGHT]
description: Hook executed after calibration sequence completes
gcode:
    # Tuỳ chọn: Tắt đèn chiếu sáng camera hoặc khôi phục trạng thái sau hiệu chuẩn
    # SET_PIN PIN=camera_light VALUE=0.0

[gcode_macro _CLEAN_NOZZLE]
description: Optional hook to wipe nozzle on brush before optical calibration
gcode:
    # Nếu máy có chổi lau đầu phun, bạn có thể gọi lệnh lau tại đây:
    # CLEAN_NOZZLE_BRUSH TOOL={params.TOOL|default(0)}

[gcode_macro _CALIBRATION_CAMERA_LED_ON]
description: Turns on camera ring light for optical inspection
gcode:
    # SET_PIN PIN=cam_light VALUE=0.4

[gcode_macro _CALIBRATION_CAMERA_LED_OFF]
description: Turns off camera ring light after inspection
gcode:
    # SET_PIN PIN=cam_light VALUE=0.0

[gcode_macro _CALIBRATION_NOZZLE_LED_OFF]
description: Turns off toolhead nozzle LED to prevent camera sensor blooming/glare
gcode:
    # STATUS_OFF

[gcode_macro _CALIBRATION_NOZZLE_LED_ON]
description: Restores toolhead nozzle LED after optical inspection
gcode:
    # STATUS_READY

# ============================================================================
# Tool-Klipper-Calibration (TKC): All-in-One Master Configuration
# ============================================================================
# Quản lý toàn bộ hệ thống Tool-Klipper-Calibration qua DUY NHẤT 1 file này!
# (Tương tự như cách kTAMV quản lý qua 1 file ktamv.cfg duy nhất).
#
# BẠN CHỈ CẦN THÊM ĐÚNG 1 DÒNG DUY NHẤT VÀO printer.cfg:
#
#   [include tool_calibrator/tool_calibrator.cfg]
#
# (Hoặc nếu máy in dùng thư mục con như Printer-Setup):
#   [include Printer-Setup/tool_calibrator/tool_calibrator.cfg]
# ============================================================================

# Tự động nạp toạ độ trạm & offsets đã học (file này tự động ghi bởi máy)
[include tool_offsets.cfg]

[tool_calibrator]
# ----------------------------------------------------------------------------
# 1. KẾT NỐI VISION SERVICE & CAMERA
# ----------------------------------------------------------------------------
# URL của Vision Service (chạy ngầm trên cổng 8090)
service_url: http://127.0.0.1:8090

# URL lấy ảnh snapshot của camera (Crowsnest snapshot endpoint)
camera_stream_url: http://127.0.0.1:8080/?action=snapshot

# Đường dẫn file tự lưu toạ độ và offsets
offsets_config_path: ~/printer_data/config/tool_calibrator/tool_offsets.cfg

# ----------------------------------------------------------------------------
# 2. ĐỘ CAO AN TOÀN (SAFE_Z) & CƠ CHẾ ƯU TIÊN
# ----------------------------------------------------------------------------
# Độ cao an toàn di chuyển giữa các trạm / đổi tool (mm).
# - Mặc định: 35.0mm.
# - Nếu bạn dùng lệnh TEACH_CAMERA_SAFE_Z (hoặc TEACH_CAMERA_SAFE_Z Z=30),
#   giá trị bạn dạy sẽ được lưu vào tool_offsets.cfg và tự nạp lại khi bật máy.
# - Nếu bạn muốn giá trị safe_z tại file này LUÔN LUÔN ÉP BUỘC (ghi đè mọi giá
#   trị cũ trong tool_offsets.cfg), hãy đặt: force_safe_z: True
# - TÍNH NĂNG ĐẶC BIỆT: Nếu đặt safe_z: 0.0 (kèm force_safe_z: True), hệ thống
#   sẽ LOẠI BỎ HOÀN TOÀN bước nâng Z lên cao khi đo Z (giữ nguyên độ cao Z
#   hiện tại bay thẳng ngang XY tới điểm đo), giúp đo Cartographer Touch cực nhanh
#   khi bạn đã xác nhận đường bay không có chướng ngại vật va chạm!
safe_z: 35.0
force_safe_z: False

# ----------------------------------------------------------------------------
# 3. TỐC ĐỘ DI CHUYỂN
# ----------------------------------------------------------------------------
travel_speed: 12000          # Tốc độ di chuyển nhanh giữa các trạm (mm/min)
approach_speed: 1500         # Tốc độ tiếp cận chậm chính xác (mm/min)
z_speed: 600                 # Tốc độ trục Z (mm/min)

# ----------------------------------------------------------------------------
# 4. Z BACKEND (Cơ chế Dò Độ Cao Trục Z)
# ----------------------------------------------------------------------------
# 'cartographer': Dùng Cartographer Touch (vòi phun chạm trực tiếp bàn in)
# 'switch': Dùng công tắc cơ khí chạm đầu phun (PF2 switch / Axiscope pin)
z_backend: cartographer

# ----------------------------------------------------------------------------
# 5. CẤU HÌNH THỊ GIÁC & LẤY MẪU (BURST SAMPLING & WIGGLE RECOVERY)
# ----------------------------------------------------------------------------
centering_samples: 3         # Số frame lấy mẫu mỗi bước căn chỉnh (1-7)
sample_delay: 0.08           # Khoảng cách giữa các frame (giây)
wiggle_distance: 0.10        # Biên độ dịch chuyển vi mô phá lóa sáng (mm)
wiggle_on_failure: True      # Bật tự động lắc vi mô khi mất dấu đầu phun
max_camera_temp: 100.0       # Giới hạn nhiệt độ an toàn bảo vệ ống kính (°C)


# ============================================================================
# MACROS ĐIỀU KHIỂN & CĂN CHỈNH TỰ ĐỘNG
# ============================================================================

[gcode_macro CALIBRATE_ALL_TOOLS]
description: Run automated XY and Z calibration on all configured tools
gcode:
    {% set calibrate_xy = params.CALIBRATE_XY|default(1)|int %}
    {% set calibrate_z = params.CALIBRATE_Z|default(1)|int %}
    {% set save_config = params.SAVE_CONFIG|default(1)|int %}
    {% set dry_run = params.DRY_RUN|default(0)|int %}
    {% set clean_nozzle = params.CLEAN_NOZZLE|default(0)|int %}
    {% set order = params.ORDER|default("XY_FIRST")|string %}
    {% set compensate_focal_z = params.COMPENSATE_FOCAL_Z|default(0)|int %}
    {% set allow_shuttle_z = params.ALLOW_SHUTTLE_Z|default(0)|int %}
    {% set continue_on_error = params.CONTINUE_ON_ERROR|default(0)|int %}
    {% set samples = params.SAMPLES|default(3)|int %}
    {% set wiggle = params.WIGGLE|default(1)|int %}
    {% set tools = params.TOOLS|default("")|string %}

    _CALIBRATION_PRE_FLIGHT

    {% if tools != "" %}
        CALIBRATE_TOOL_OFFSETS TOOLS={tools} CALIBRATE_XY={calibrate_xy} CALIBRATE_Z={calibrate_z} SAVE_CONFIG={save_config} DRY_RUN={dry_run} CLEAN_NOZZLE={clean_nozzle} ORDER={order} COMPENSATE_FOCAL_Z={compensate_focal_z} ALLOW_SHUTTLE_Z={allow_shuttle_z} CONTINUE_ON_ERROR={continue_on_error} SAMPLES={samples} WIGGLE={wiggle}
    {% else %}
        CALIBRATE_TOOL_OFFSETS CALIBRATE_XY={calibrate_xy} CALIBRATE_Z={calibrate_z} SAVE_CONFIG={save_config} DRY_RUN={dry_run} CLEAN_NOZZLE={clean_nozzle} ORDER={order} COMPENSATE_FOCAL_Z={compensate_focal_z} ALLOW_SHUTTLE_Z={allow_shuttle_z} CONTINUE_ON_ERROR={continue_on_error} SAMPLES={samples} WIGGLE={wiggle}
    {% endif %}

    _CALIBRATION_POST_FLIGHT

[gcode_macro CALIBRATE_TOOL]
description: Calibrate specific tool(s) by index (e.g. CALIBRATE_TOOL TOOL=1)
gcode:
    {% set tool = params.TOOL|default(-1)|int %}
    {% set calibrate_xy = params.CALIBRATE_XY|default(1)|int %}
    {% set calibrate_z = params.CALIBRATE_Z|default(1)|int %}
    {% set save_config = params.SAVE_CONFIG|default(1)|int %}
    {% set dry_run = params.DRY_RUN|default(0)|int %}
    {% set clean_nozzle = params.CLEAN_NOZZLE|default(0)|int %}
    {% set order = params.ORDER|default("XY_FIRST")|string %}
    {% set compensate_focal_z = params.COMPENSATE_FOCAL_Z|default(0)|int %}
    {% set allow_shuttle_z = params.ALLOW_SHUTTLE_Z|default(0)|int %}
    {% set continue_on_error = params.CONTINUE_ON_ERROR|default(0)|int %}
    {% set samples = params.SAMPLES|default(3)|int %}
    {% set wiggle = params.WIGGLE|default(1)|int %}

    {% if tool < 0 %}
        {% if printer.toolchanger is defined and printer.toolchanger.tool_number >= 0 %}
            {% set tool = printer.toolchanger.tool_number %}
        {% elif printer.tool_probe is defined and printer.tool_probe.active_tool_number is defined and printer.tool_probe.active_tool_number >= 0 %}
            {% set tool = printer.tool_probe.active_tool_number %}
        {% else %}
            {action_raise_error("CALIBRATE_TOOL requires a valid TOOL parameter, e.g. CALIBRATE_TOOL TOOL=1, or an active tool loaded on the toolchanger.")}
        {% endif %}
    {% endif %}

    _CALIBRATION_PRE_FLIGHT

    CALIBRATE_TOOL_OFFSETS TOOLS={tool} CALIBRATE_XY={calibrate_xy} CALIBRATE_Z={calibrate_z} SAVE_CONFIG={save_config} DRY_RUN={dry_run} CLEAN_NOZZLE={clean_nozzle} ORDER={order} COMPENSATE_FOCAL_Z={compensate_focal_z} ALLOW_SHUTTLE_Z={allow_shuttle_z} CONTINUE_ON_ERROR={continue_on_error} SAMPLES={samples} WIGGLE={wiggle}

    _CALIBRATION_POST_FLIGHT

[gcode_macro CALIBRATE_TOOLS_XY]
description: Calibrate optical XY offset only (all tools or TOOLS parameter)
gcode:
    {% set tools = params.TOOLS|default("")|string %}
    {% set save_config = params.SAVE_CONFIG|default(1)|int %}
    {% set dry_run = params.DRY_RUN|default(0)|int %}
    {% set clean_nozzle = params.CLEAN_NOZZLE|default(0)|int %}
    {% set continue_on_error = params.CONTINUE_ON_ERROR|default(0)|int %}
    {% set samples = params.SAMPLES|default(3)|int %}
    {% set wiggle = params.WIGGLE|default(1)|int %}

    _CALIBRATION_PRE_FLIGHT

    {% if tools != "" %}
        CALIBRATE_TOOL_OFFSETS TOOLS={tools} CALIBRATE_XY=1 CALIBRATE_Z=0 SAVE_CONFIG={save_config} DRY_RUN={dry_run} CLEAN_NOZZLE={clean_nozzle} CONTINUE_ON_ERROR={continue_on_error} SAMPLES={samples} WIGGLE={wiggle}
    {% else %}
        CALIBRATE_TOOL_OFFSETS CALIBRATE_XY=1 CALIBRATE_Z=0 SAVE_CONFIG={save_config} DRY_RUN={dry_run} CLEAN_NOZZLE={clean_nozzle} CONTINUE_ON_ERROR={continue_on_error} SAMPLES={samples} WIGGLE={wiggle}
    {% endif %}

    _CALIBRATION_POST_FLIGHT

[gcode_macro CALIBRATE_TOOLS_Z]
description: Calibrate probe Z offset only (all tools or TOOLS parameter)
gcode:
    {% set tools = params.TOOLS|default("")|string %}
    {% set save_config = params.SAVE_CONFIG|default(1)|int %}
    {% set dry_run = params.DRY_RUN|default(0)|int %}
    {% set clean_nozzle = params.CLEAN_NOZZLE|default(0)|int %}
    {% set allow_shuttle_z = params.ALLOW_SHUTTLE_Z|default(0)|int %}
    {% set continue_on_error = params.CONTINUE_ON_ERROR|default(0)|int %}

    _CALIBRATION_PRE_FLIGHT

    {% if tools != "" %}
        CALIBRATE_TOOL_OFFSETS TOOLS={tools} CALIBRATE_XY=0 CALIBRATE_Z=1 SAVE_CONFIG={save_config} DRY_RUN={dry_run} CLEAN_NOZZLE={clean_nozzle} ALLOW_SHUTTLE_Z={allow_shuttle_z} CONTINUE_ON_ERROR={continue_on_error}
    {% else %}
        CALIBRATE_TOOL_OFFSETS CALIBRATE_XY=0 CALIBRATE_Z=1 SAVE_CONFIG={save_config} DRY_RUN={dry_run} CLEAN_NOZZLE={clean_nozzle} ALLOW_SHUTTLE_Z={allow_shuttle_z} CONTINUE_ON_ERROR={continue_on_error}
    {% endif %}

    _CALIBRATION_POST_FLIGHT

[gcode_macro CALIBRATE_TOOL_XY]
description: Calibrate optical XY offset only for a specific tool (e.g. CALIBRATE_TOOL_XY TOOL=1)
gcode:
    {% set tool = params.TOOL|default(-1)|int %}
    {% set save_config = params.SAVE_CONFIG|default(1)|int %}
    {% set dry_run = params.DRY_RUN|default(0)|int %}
    {% set clean_nozzle = params.CLEAN_NOZZLE|default(0)|int %}
    {% set continue_on_error = params.CONTINUE_ON_ERROR|default(0)|int %}
    {% set samples = params.SAMPLES|default(3)|int %}
    {% set wiggle = params.WIGGLE|default(1)|int %}

    {% if tool < 0 %}
        {% if printer.toolchanger is defined and printer.toolchanger.tool_number >= 0 %}
            {% set tool = printer.toolchanger.tool_number %}
        {% elif printer.tool_probe is defined and printer.tool_probe.active_tool_number is defined and printer.tool_probe.active_tool_number >= 0 %}
            {% set tool = printer.tool_probe.active_tool_number %}
        {% else %}
            {action_raise_error("CALIBRATE_TOOL_XY requires a valid TOOL parameter, e.g. CALIBRATE_TOOL_XY TOOL=1 (or run CALIBRATE_TOOLS_XY for all tools)")}
        {% endif %}
    {% endif %}

    _CALIBRATION_PRE_FLIGHT

    CALIBRATE_TOOL_OFFSETS TOOLS={tool} CALIBRATE_XY=1 CALIBRATE_Z=0 SAVE_CONFIG={save_config} DRY_RUN={dry_run} CLEAN_NOZZLE={clean_nozzle} CONTINUE_ON_ERROR={continue_on_error} SAMPLES={samples} WIGGLE={wiggle}

    _CALIBRATION_POST_FLIGHT

[gcode_macro CALIBRATE_TOOL_Z]
description: Calibrate probe Z offset only for a specific tool (e.g. CALIBRATE_TOOL_Z TOOL=1)
gcode:
    {% set tool = params.TOOL|default(-1)|int %}
    {% set save_config = params.SAVE_CONFIG|default(1)|int %}
    {% set dry_run = params.DRY_RUN|default(0)|int %}

# ============================================================================
# Tool-Klipper-Calibration: Sample Configuration
# ============================================================================
# Copy or include this configuration in your printer.cfg:
#   [include macros/tool_calibrator_macros.cfg]
#   [include macros/safe_staging_macros.cfg]
#   [include ~/printer_data/config/tool_offsets.cfg]
# ============================================================================

[tool_calibrator]
# URL of the tool calibrator vision background service daemon
service_url: http://127.0.0.1:8090

# URL of the camera stream/snapshot (Crowsnest snapshot endpoint)
camera_stream_url: http://127.0.0.1:8080/?action=snapshot

# Destination file where calibrated offsets will be saved atomically
offsets_config_path: ~/printer_data/config/tool_offsets.cfg

# Global Safe Z travel height above all obstacles/docks (mm)
safe_z: 35.0

# ----------------------------------------------------------------------------
# Camera & Switch Station Coordinates (FULLY AUTOMATED or OPTIONAL OVERRIDE)
# ----------------------------------------------------------------------------
# NOTE: You DO NOT need to calculate or write coordinates manually!
# 1. 1-Click Teaching: Jog nozzle near camera/switch and run AUTO_TEACH_CAMERA
#    or AUTO_TEACH_SWITCH. The system auto-centers, automatically calculates
#    safe approach vectors towards the bed center, and auto-saves to tool_offsets.cfg.
# 2. Auto-Inheritance: If you already use [tools_calibrate], switch coordinates
#    are automatically inherited from Klipper objects without any configuration!
# 3. If specified below, manual values will override auto-learned coordinates:
#
# camera_target_x: 150.0
# camera_target_y: 10.0
# camera_target_z: 22.0
# (Approach waypoints are automatically calculated pointing towards bed center)
# camera_approach_x: 150.0
# camera_approach_y: 35.0

# Travel feedrates (mm/min)
travel_speed: 12000
approach_speed: 3000

# ----------------------------------------------------------------------------
# Z Offset Probing Configuration
# ----------------------------------------------------------------------------
# Supported backends: 'switch' (mechanical endstop switch) or 'cartographer'
z_backend: switch

# Coordinates for mechanical Z switch (auto-inherited from tools_calibrate if omitted)
# switch_target_x: 220.0
# switch_target_y: 345.0
# switch_target_z: 15.0

# Approach waypoint for switch station
switch_approach_x: 220.0
switch_approach_y: 320.0
switch_approach_z: 15.0

# Probing speed & parameters for switch backend
probing_speed: 3.0
lift_speed: 5.0
samples: 3
samples_tolerance: 0.010
samples_retract_dist: 2.0

# Switch endstop pin (leave empty if tools_calibrate already registers this pin)
# switch_pin: ^PG12

# ----------------------------------------------------------------------------
# Cartographer Touch V4 Configuration (if z_backend is 'cartographer')
# ----------------------------------------------------------------------------
# cartographer_touch_model: default
# cartographer_touch_threshold: 1000

# ============================================================================
# Tool-Klipper-Calibration: Moonraker Update Manager Integration
# ============================================================================
# Sao chép khối cấu hình này dán vào file moonraker.conf (thường nằm tại
# ~/printer_data/config/moonraker.conf) để bật tính năng theo dõi và cập nhật
# tự động với 1-Click Update trực tiếp trên Mainsail hoặc Fluidd.
# ============================================================================

[update_manager tool_calibrator]
type: git_repo
path: ~/Tool-Klipper-Calibration
origin: https://github.com/IDcrazy123/Tool-Klipper-Calibration.git
primary_branch: main
virtualenv: ~/Tool-Klipper-Calibration/env
requirements: server/requirements.txt
is_system_service: True
managed_services:
    tool_calibrator
    klipper
info_tags:
    desc=Tool-Klipper-Calibration Automated Vision & Z Alignment
